<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Babiversary!!!</title>
<style>
  :root{
    --bg: #0a0a0a;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: 'Courier New', monospace;
    color:#eee;
    padding: 32px 16px;
    gap: 20px;
  }
  h1{
    margin:0;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: clamp(22px, 4vw, 36px);
    text-align:center;
    color:#fff;
  }
  .sub{
    color:#999;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top:-14px;
  }
  #wrap{
    position: relative;
    background: var(--paper);
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 4px;
    max-width: 96vw;
  }
  canvas#output{
    display:block;
    max-width: 100%;
    height: auto;
    background:#fff;
    border-radius: 2px;
  }
  #source{ display:none; }
  .controls{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items:center;
    justify-content:center;
    color:#bbb;
    font-size: 13px;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:8px;
    background:#161616;
    padding:8px 14px;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
  }
  input[type=range]{ accent-color:#fff; }
  button{
    background:#fff;
    color:#000;
    border:none;
    padding:9px 18px;
    border-radius: 20px;
    font-family: inherit;
    font-weight:bold;
    letter-spacing: 1px;
    cursor:pointer;
  }
  button:hover{ background:#ddd; }
  .loading{
    color:#888;
    font-size: 13px;
    letter-spacing: 1px;
  }
</style>
</head>

let sampleCanvas = document.createElement('canvas');
let sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

function render(){
  if(!img.complete || img.naturalWidth === 0){ return; }

  const cell = parseInt(cellSizeInput.value, 10);
  const contrast = parseInt(contrastInput.value, 10) / 100;

  const rows = Math.floor(outH / cell);

  sampleCanvas.width = cols;
  sampleCanvas.height = rows;
  sampleCtx.imageSmoothingEnabled = true;
  // draw scaled-down + desaturated image to sample canvas to get one brightness value per cell
  sampleCtx.drawImage(img, 0, 0, cols, rows);
  const data = sampleCtx.getImageData(0, 0, cols, rows).data;

  outputCanvas.width = cols * cell;
  outputCanvas.height = rows * cell;

  // paper background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  // Build one continuous character stream so the phrase flows across the whole portrait
  let charIndex = 0;
  function nextChar(){
    const c = PHRASE[charIndex % PHRASE.length];
    charIndex++;
    return c;
  }

  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      const i = (r * cols + c) * 4;
      const red = data[i], green = data[i+1], blue = data[i+2];
      let lum = 0.299*red + 0.587*green + 0.114*blue; // 0 (black) - 255 (white)
      lum = lum / 255;

      // apply contrast curve around midpoint
      lum = ((lum - 0.5) * contrast) + 0.5;
      lum = Math.min(1, Math.max(0, lum));

      if(invert) lum = 1 - lum;

      // darker pixel (lower lum) => bolder/larger/blacker character
      const darkness = 1 - lum; // 0 = white/empty, 1 = full black

      const ch = nextChar();

      // Always draw a character — even the lightest areas get a faint glyph
      // so the whole portrait is built out of text with no blank gaps.
      const minDarkness = 0.10;
      const effectiveDarkness = Math.max(minDarkness, darkness);

      const fontSize = Math.max(cell * 0.85, cell * (0.85 + effectiveDarkness*0.9));
      const gray = Math.round(255 * (1 - effectiveDarkness)); // map darkness to gray value
      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.font = `${effectiveDarkness > 0.5 ? '900' : '700'} ${fontSize}px 'Courier New', monospace`;

      const x = c * cell;
      const y = r * cell + cell/2;
      ctx.fillText(ch, x, y);
    }
  }

  statusEl.textContent = `${cols * rows} characters · ${outputCanvas.width}×${outputCanvas.height}px`;
}

img.onload = () => {
  statusEl.textContent = 'rendering…';
  requestAnimationFrame(render);
};

[cellSizeInput, contrastInput, invertInput].forEach(el=>{
  el.addEventListener('input', () => {
    statusEl.textContent = 'rendering…';
    requestAnimationFrame(render);
  });
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'happy-babiversary-word-portrait.png';
  link.href = outputCanvas.toDataURL('image/png');
  link.click();
});

if(img.complete && img.naturalWidth > 0){ render(); }
</script>
</body>
</html>
